spring.application.name=order
# Later import wins over generic runtime port and consumer group defaults.
spring.config.import=classpath:runtime-defaults.properties,classpath:order-defaults.properties
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:runtime-schema.sql,classpath:schema.sql
order.catalog.url=${CATALOG_URL:http://localhost:8081}
order.catalog.connect-timeout=2s
order.catalog.read-timeout=3s
