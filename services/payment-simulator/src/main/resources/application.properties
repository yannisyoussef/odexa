spring.application.name=payment-simulator
server.port=${SERVER_PORT:8085}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/simulator}
spring.datasource.username=${DB_USER:simulator}
spring.datasource.password=${DB_PASSWORD}
simulator.provider-api-key=${PROVIDER_API_KEY}
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.accept-float-as-int=false
spring.jackson.mapper.allow-coercion-of-scalars=false
spring.mvc.problemdetails.enabled=true
spring.mvc.log-request-details=false
logging.level.org.springframework.jdbc.core=INFO
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
logging.structured.format.console=logstash
spring.sql.init.mode=never
spring.flyway.clean-disabled=true
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-migration-naming=true
