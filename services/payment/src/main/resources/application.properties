spring.application.name=payment
# Later import wins over generic runtime port/database defaults.
spring.config.import=classpath:runtime-defaults.properties,classpath:payment-defaults.properties
payment.simulator-url=${SIMULATOR_URL:http://localhost:8085}
payment.provider-api-key=${PROVIDER_API_KEY}
payment.worker.enabled=${PAYMENT_WORKER_ENABLED:true}
payment.worker.poll-ms=${PAYMENT_POLL_MS:500}
payment.worker.max-attempts=${PAYMENT_MAX_ATTEMPTS:5}
payment.worker.lease-seconds=${PAYMENT_LEASE_SECONDS:30}
payment.worker.base-backoff-seconds=${PAYMENT_BACKOFF_SECONDS:2}
payment.worker.max-backoff-seconds=${PAYMENT_MAX_BACKOFF_SECONDS:60}
spring.sql.init.mode=never
spring.flyway.clean-disabled=true
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-migration-naming=true

payment.provider=${PAYMENT_PROVIDER:simulator}
payment.stripe.enabled=${STRIPE_ENABLED:false}
payment.stripe.api-key=${STRIPE_API_KEY:}
payment.stripe.webhook-secrets=${STRIPE_WEBHOOK_SECRETS:}
payment.simulator.webhook-secrets=${SIMULATOR_WEBHOOK_SECRETS:}

spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.accept-float-as-int=false
spring.jackson.mapper.allow-coercion-of-scalars=false
