spring.application.name=gateway
server.port=${SERVER_PORT:8080}
server.forward-headers-strategy=none
server.max-http-request-header-size=16KB
server.tomcat.max-http-form-post-size=32KB
server.tomcat.max-swallow-size=32KB
server.tomcat.connection-timeout=5s
spring.servlet.multipart.enabled=false
spring.threads.virtual.enabled=true
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
logging.structured.format.console=ecs
server.error.include-message=never
server.error.include-stacktrace=never
spring.mvc.log-request-details=false
gateway.catalog-url=${CATALOG_URL:http://localhost:8081}
gateway.inventory-url=${INVENTORY_URL:http://localhost:8082}
gateway.order-url=${ORDER_URL:http://localhost:8083}
gateway.payment-url=${PAYMENT_URL:http://localhost:8084}
gateway.max-request-bytes=32768
gateway.max-response-bytes=2097152
gateway.requests-per-second=${GATEWAY_REQUESTS_PER_SECOND:100}
gateway.burst=${GATEWAY_BURST:200}
