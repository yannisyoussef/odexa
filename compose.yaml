name: odexa

x-app: &app
  restart: unless-stopped
  init: true
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  networks: [backend]
  mem_limit: 768m

x-domain-env: &domain-env
  SPRING_PROFILES_ACTIVE: local
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  OIDC_ISSUER: ${OIDC_ISSUER:-http://localhost:8180/realms/odexa}
  OIDC_JWKS: http://keycloak:8080/realms/odexa/protocol/openid-connect/certs

x-domain-depends: &domain-depends
  postgres:
    condition: service_healthy
  kafka:
    condition: service_healthy
  keycloak:
    condition: service_healthy

services:
  postgres:
    image: postgres:17.6-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: odexa_admin
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run python3 scripts/bootstrap-local.py first}
      CATALOG_DB_PASSWORD: ${CATALOG_DB_PASSWORD:?Bootstrap required}
      INVENTORY_DB_PASSWORD: ${INVENTORY_DB_PASSWORD:?Bootstrap required}
      ORDER_DB_PASSWORD: ${ORDER_DB_PASSWORD:?Bootstrap required}
      PAYMENT_DB_PASSWORD: ${PAYMENT_DB_PASSWORD:?Bootstrap required}
      SIMULATOR_DB_PASSWORD: ${SIMULATOR_DB_PASSWORD:?Bootstrap required}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Bootstrap required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/postgres/01-databases.sql:/docker-entrypoint-initdb.d/01-databases.sql:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U odexa_admin -d postgres']
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [backend]

  kafka:
    image: apache/kafka:4.1.1
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: b2RleGEtbG9jYWwta3JhZnQ
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: [CMD-SHELL, '/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1']
      interval: 10s
      timeout: 8s
      start_period: 20s
      retries: 20
    networks: [backend]

  keycloak:
    image: quay.io/keycloak/keycloak:26.4.7
    command: [start-dev, --import-realm]
    restart: unless-stopped
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Bootstrap required}
      KC_BOOTSTRAP_ADMIN_USERNAME: local-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:?Bootstrap required}
      KC_HOSTNAME: http://localhost:8180
      KC_HTTP_ENABLED: 'true'
      KC_HEALTH_ENABLED: 'true'
    ports:
      - 127.0.0.1:8180:8080
    volumes:
      - ./.local/keycloak/odexa-realm.json:/opt/keycloak/data/import/odexa-realm.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, 'bash -ec ''exec 3<>/dev/tcp/127.0.0.1/9000; printf "GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3; grep -q "200 OK" <&3''']
      interval: 10s
      timeout: 5s
      start_period: 40s
      retries: 20
    networks: [backend]

  gateway:
    <<: *app
    build:
      context: .
      args: {SERVICE: gateway}
    environment:
      SERVER_PORT: 8080
      CATALOG_URL: http://catalog:8081
      INVENTORY_URL: http://inventory:8082
      ORDER_URL: http://order:8083
      PAYMENT_URL: http://payment:8084
    ports:
      - 127.0.0.1:8080:8080
    depends_on:
      catalog: {condition: service_healthy}
      inventory: {condition: service_healthy}
      order: {condition: service_healthy}
      payment: {condition: service_healthy}

  catalog:
    <<: *app
    build:
      context: .
      args: {SERVICE: catalog}
    environment:
      <<: *domain-env
      SERVER_PORT: 8081
      DB_URL: jdbc:postgresql://postgres:5432/catalog
      DB_USER: catalog
      DB_PASSWORD: ${CATALOG_DB_PASSWORD:?Bootstrap required}
    depends_on: *domain-depends

  inventory:
    <<: *app
    build:
      context: .
      args: {SERVICE: inventory}
    environment:
      <<: *domain-env
      SERVER_PORT: 8082
      DB_URL: jdbc:postgresql://postgres:5432/inventory
      DB_USER: inventory
      DB_PASSWORD: ${INVENTORY_DB_PASSWORD:?Bootstrap required}
    depends_on: *domain-depends

  order:
    <<: *app
    build:
      context: .
      args: {SERVICE: order}
    environment:
      <<: *domain-env
      SERVER_PORT: 8083
      DB_URL: jdbc:postgresql://postgres:5432/orders
      DB_USER: orders
      DB_PASSWORD: ${ORDER_DB_PASSWORD:?Bootstrap required}
      CATALOG_URL: http://catalog:8081
    depends_on: *domain-depends

  payment:
    <<: *app
    build:
      context: .
      args: {SERVICE: payment}
    environment:
      <<: *domain-env
      SERVER_PORT: 8084
      DB_URL: jdbc:postgresql://postgres:5432/payment
      DB_USER: payment
      DB_PASSWORD: ${PAYMENT_DB_PASSWORD:?Bootstrap required}
      SIMULATOR_URL: http://payment-simulator:8085
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-simulator}
      STRIPE_ENABLED: ${STRIPE_ENABLED:-false}
      STRIPE_API_KEY: ${STRIPE_API_KEY:-}
      STRIPE_WEBHOOK_SECRETS: ${STRIPE_WEBHOOK_SECRETS:-}
      SIMULATOR_WEBHOOK_SECRETS: ${SIMULATOR_WEBHOOK_SECRET:?Bootstrap required}
      PROVIDER_API_KEY: ${PROVIDER_API_KEY:?Bootstrap required}
    depends_on:
      <<: *domain-depends
      payment-simulator: {condition: service_healthy}

  payment-simulator:
    <<: *app
    build:
      context: .
      args: {SERVICE: payment-simulator}
    environment:
      SPRING_PROFILES_ACTIVE: local
      SERVER_PORT: 8085
      DB_URL: jdbc:postgresql://postgres:5432/simulator
      DB_USER: simulator
      DB_PASSWORD: ${SIMULATOR_DB_PASSWORD:?Bootstrap required}
      PROVIDER_API_KEY: ${PROVIDER_API_KEY:?Bootstrap required}
      SIMULATOR_WEBHOOKS_ENABLED: true
      SIMULATOR_WEBHOOK_SECRET: ${SIMULATOR_WEBHOOK_SECRET:?Bootstrap required}
    depends_on:
      postgres: {condition: service_healthy}

  smoke:
    image: python:3.13.7-slim-bookworm
    profiles: [verification]
    working_dir: /workspace
    entrypoint: [python, -B, scripts/smoke.py]
    environment:
      ODEXA_ENV_FILE: /run/odexa.env
      SMOKE_GATEWAY_URL: http://gateway:8080
      SMOKE_ISSUER_URL: http://keycloak:8080/realms/odexa
      SMOKE_SIMULATOR_URL: http://payment-simulator:8085
    volumes:
      - ./scripts:/workspace/scripts:ro
      - ./contracts:/workspace/contracts:ro
      - ./.env:/run/odexa.env:ro
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [backend]
    depends_on:
      gateway: {condition: service_healthy}

networks:
  backend:
    driver: bridge
volumes:
  postgres-data:
  kafka-data:
