# Imported explicitly by each application; this library is not a Boot application.
server.port=${SERVER_PORT:8080}
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false
spring.mvc.log-request-details=false
logging.structured.format.console=ecs
# SQL trace and Kafka listener exception logs can expose business payloads.
logging.level.org.springframework.jdbc.core=INFO
logging.level.org.apache.kafka.clients.producer.internals=OFF
logging.level.org.springframework.kafka.support.LoggingProducerListener=OFF

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/odexa}
spring.datasource.username=${DB_USER:odexa}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=5000
spring.sql.init.mode=never
spring.sql.init.continue-on-error=false

spring.security.oauth2.resourceserver.jwt.issuer-uri=${OIDC_ISSUER:http://localhost:8180/realms/odexa}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${OIDC_JWKS:http://localhost:8180/realms/odexa/protocol/openid-connect/certs}
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

runtime.events.enabled=true
runtime.events.partitions=3
runtime.events.replication-factor=1
runtime.events.retry-interval-ms=1000
runtime.events.retry-attempts=3
runtime.events.publish-timeout-ms=5000
runtime.outbox.batch-size=25
runtime.outbox.poll-delay-ms=1000
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=${spring.application.name}
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.max-poll-records=25
spring.kafka.consumer.properties.allow.auto.create.topics=false
spring.kafka.listener.ack-mode=record
spring.kafka.listener.log-container-config=false
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.in.flight.requests.per.connection=5
spring.kafka.producer.properties.max.block.ms=5000
spring.kafka.producer.properties.delivery.timeout.ms=10000
spring.kafka.producer.properties.request.timeout.ms=5000
spring.kafka.producer.properties.linger.ms=5
spring.kafka.admin.auto-create=${runtime.events.enabled:true}
spring.kafka.listener.auto-startup=${runtime.events.enabled:true}
